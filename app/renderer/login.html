<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RockyPrint · Iniciar sesión</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="screen">
    <form id="loginForm" class="card" autocomplete="off">
      <div class="logo">🧾 RockyPrint</div>
      <h1>Iniciar sesión</h1>

      <label>Usuario</label>
      <input id="usuario" placeholder="Ej. caja1" autofocus />

      <label>Contraseña</label>
      <input id="clave" type="password" placeholder="••••••••" />

      <label>Área</label>
      <select id="area">
        <option value="caja" selected>Caja</option>
        <option value="produccion">Producción</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit" class="btn">Entrar</button>
      <p id="err" class="err"></p>
      <p class="hint">Roles soportados: <b>caja</b>, <b>produccion</b>, <b>admin</b>.</p>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
